name: publish

# Publishes backend Docker images to Docker Hub after successful builds.
# Note: This workflow publishes backend-only images as part of the separated
# fider-backend repository architecture. The Dockerfile builds Go backend
# without frontend assets, which are deployed separately from fider-frontend.

on:
  workflow_run:
    workflows: ["build"]
    types:
      - completed

jobs:
  publish:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Dump GitHub context
        run: echo "$GITHUB_CONTEXT"
        env:
          GITHUB_CONTEXT: ${{ toJSON(github) }}

      - name: Checkout
        uses: actions/checkout@v2
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}

      # Build and push backend Docker image for pull request testing
      - name: build and push docker image (pull_request)
        if: ${{ github.event.workflow_run.event == 'pull_request' }}
        uses: docker/build-push-action@v3
        with:
          push: true
          context: .
          build-args: COMMITHASH=${{ github.event.workflow_run.head_sha }}
          platforms: linux/amd64
          tags: getfider/fider:PR_${{ github.event.workflow_run.pull_requests[0].number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Build and push multi-arch backend Docker image for branch commits
      # Tags: SHA-specific and branch-based (main or stable) for deployment
      - name: build and push docker image (push branch)
        if: ${{ github.event.workflow_run.event == 'push' }}
        uses: docker/build-push-action@v3
        with:
          push: true
          context: .
          build-args: COMMITHASH=${{ github.event.workflow_run.head_sha }}
          platforms: linux/amd64,linux/arm64/v8
          tags: |
            getfider/fider:SHA_${{ github.event.workflow_run.head_sha }}
            getfider/fider:${{ github.event.workflow_run.head_branch == 'main' && 'main' || 'stable' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Build and push multi-arch backend Docker image for release tags
      # Tags: Version-specific for production deployment
      - name: build and push docker image (push tag)
        if: ${{ github.event.workflow_run.event == 'release' }}
        uses: docker/build-push-action@v3
        with:
          push: true
          context: .
          build-args: |
            COMMITHASH=${{ github.event.workflow_run.head_sha }}
            VERSION=${{ github.event.workflow_run.display_title }}
          platforms: linux/amd64,linux/arm64/v8
          tags: getfider/fider:${{ github.event.workflow_run.display_title }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
